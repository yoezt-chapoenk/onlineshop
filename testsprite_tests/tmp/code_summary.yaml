version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router)
  - React 19
  - Tailwind CSS v4
  - Supabase (Auth + PostgreSQL)
  - Zod v4
  - Lucide React
routes:
  - path: /
    file: src/app/(storefront)/page.tsx
    auth_required: false
    description: Homepage with hero, featured products, categories, and FAQ
  - path: /shop
    file: src/app/(storefront)/shop/page.tsx
    auth_required: false
    description: Product catalog with filters and sorting
  - path: /shop/[slug]
    file: src/app/(storefront)/shop/[slug]/page.tsx
    auth_required: false
    description: Product detail page with specs, variants, pricing tiers
  - path: /collections
    file: src/app/(storefront)/collections/page.tsx
    auth_required: false
    description: Category collections page
  - path: /cart
    file: src/app/(storefront)/cart/page.tsx
    auth_required: false
    description: Shopping cart with quantity controls and subtotal
  - path: /checkout
    file: src/app/(storefront)/checkout/page.tsx
    auth_required: false
    description: Checkout with area autocomplete, live shipping rates, payment selection
  - path: /checkout/success
    file: src/app/(storefront)/checkout/success/page.tsx
    auth_required: false
    description: Order confirmation page
  - path: /about
    file: src/app/(storefront)/about/page.tsx
    auth_required: false
    description: About us page
  - path: /contact
    file: src/app/(storefront)/contact/page.tsx
    auth_required: false
    description: Contact form page
  - path: /wholesale
    file: src/app/(storefront)/wholesale/page.tsx
    auth_required: false
    description: Wholesale pricing information page
  - path: /login
    file: src/app/(storefront)/login/page.tsx
    auth_required: false
    description: User login page
  - path: /register
    file: src/app/(storefront)/register/page.tsx
    auth_required: false
    description: User registration page
  - path: /forgot-password
    file: src/app/(storefront)/forgot-password/page.tsx
    auth_required: false
    description: Password reset request page
  - path: /account
    file: src/app/(storefront)/account/page.tsx
    auth_required: true
    description: Account dashboard overview
  - path: /account/become-reseller
    file: src/app/(storefront)/account/become-reseller/page.tsx
    auth_required: true
    description: Reseller application form
  - path: /legal/shipping
    file: src/app/(storefront)/legal/shipping/page.tsx
    auth_required: false
    description: Shipping policy page
  - path: /legal/privacy
    file: src/app/(storefront)/legal/privacy/page.tsx
    auth_required: false
    description: Privacy policy page
  - path: /legal/terms
    file: src/app/(storefront)/legal/terms/page.tsx
    auth_required: false
    description: Terms and conditions page
features:
  - name: Product Browsing
    description: Browse product catalog with filters for category, gender, style, frame type, and color
    files:
      - src/app/(storefront)/shop/page.tsx
      - src/app/(storefront)/shop/[slug]/page.tsx
      - src/components/products/ProductCard.tsx
    entry_route: /shop
    user_interactions:
      - View product grid on shop page
      - Apply category filter (Eyeglasses, Sunglasses, Blue Light, Accessories)
      - Click on a product card to view details
      - View product specifications, pricing tiers, and variant options
      - Select product variant (color/type/size)
    api_calls:
      - method: GET
        endpoint: /api/products
    auth_required: false
  - name: Shopping Cart
    description: Add products to cart, manage quantities, view subtotal with tier pricing
    files:
      - src/app/(storefront)/cart/page.tsx
      - src/components/cart/CartProvider.tsx
    entry_route: /cart
    user_interactions:
      - Click Add to Cart button on product page
      - View cart items with quantities and prices
      - Increase or decrease item quantity
      - Remove item from cart
      - See subtotal update in real-time
      - Click Checkout button
    api_calls: []
    auth_required: false
  - name: Checkout with Biteship Shipping
    description: Complete purchase with address autocomplete, real-time shipping rates from Biteship, and payment method selection
    files:
      - src/app/(storefront)/checkout/page.tsx
      - src/components/checkout/AreaSearch.tsx
      - src/components/checkout/ShippingRates.tsx
      - src/lib/biteship.ts
    entry_route: /checkout
    user_interactions:
      - Fill customer name, phone, and email
      - Type city/district name in autocomplete field
      - Select area from dropdown results
      - See province, city, and postal code auto-filled
      - Fill detailed address
      - View available shipping rates (JNE, J&T, Central Cargo)
      - Select shipping courier and service
      - Select payment method (QRIS, VA, Transfer)
      - Review order summary with shipping cost
      - Click submit order button
    api_calls:
      - method: GET
        endpoint: /api/shipping/areas?q={query}
      - method: POST
        endpoint: /api/shipping/rates
      - method: POST
        endpoint: /api/orders
    auth_required: false
  - name: User Authentication
    description: Login, register, and password reset via Supabase Auth
    files:
      - src/app/(storefront)/login/page.tsx
      - src/app/(storefront)/register/page.tsx
      - src/app/(storefront)/forgot-password/page.tsx
      - src/components/auth/SessionProvider.tsx
    entry_route: /login
    user_interactions:
      - Fill email and password on login page
      - Click Login button
      - Click Register link to create account
      - Fill registration form (name, email, phone, password)
      - Click Forgot Password link
      - Enter email for password reset
    api_calls: []
    auth_required: false
  - name: Contact Form
    description: Submit contact message to the store
    files:
      - src/app/(storefront)/contact/page.tsx
    entry_route: /contact
    user_interactions:
      - Fill name, email, subject, and message fields
      - Click submit button
      - See success confirmation
    api_calls:
      - method: POST
        endpoint: /api/contact-messages
    auth_required: false
  - name: Navigation and Layout
    description: Header navigation, footer, floating WhatsApp button, mobile responsive menu
    files:
      - src/components/layout/Header.tsx
      - src/components/layout/Footer.tsx
      - src/app/(storefront)/layout.tsx
    entry_route: /
    user_interactions:
      - Click navigation links (Beranda, Belanja, Koleksi, Tentang Kami, Grosir, Kontak)
      - Click cart icon to go to cart page
      - Click login/account link
      - Click floating WhatsApp button
      - Use mobile hamburger menu
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Cart is stored in localStorage, not synced across devices
    location: src/components/cart/CartProvider.tsx
    impact: Cart contents lost when clearing browser data or switching devices
  - issue: Payment processing is not yet integrated (no Midtrans/Xendit)
    location: src/app/api/orders/route.ts
    impact: Orders are created with pending status but no actual payment flow
